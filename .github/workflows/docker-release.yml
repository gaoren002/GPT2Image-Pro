name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      next_public_app_url:
        description: "Public application URL baked into the web image"
        required: true
        default: "http://localhost:3000"
        type: string
      generations_bucket_name:
        description: "Object storage bucket for generated images"
        required: true
        default: "generations"
        type: string
      avatars_bucket_name:
        description: "Object storage bucket for public avatars"
        required: true
        default: "avatars"
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: gpt2image-pro-web
            dockerfile: Dockerfile.web
            target: runner
          - name: migrate
            image: gpt2image-pro-migrate
            dockerfile: Dockerfile.web
            target: migrator
          - name: chatgpt-web-proxy
            image: gpt2image-pro-chatgpt-web-proxy
            dockerfile: Dockerfile.chatgpt-web-proxy
            target: runner
          - name: chatgpt-register
            image: gpt2image-pro-chatgpt-register
            dockerfile: Dockerfile.chatgpt-register
            target: runner

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（钉 SHA；dependabot 维护）

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/meowfree/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ inputs.next_public_app_url || 'http://localhost:3000' }}
            NEXT_PUBLIC_APP_NAME=GPT2IMAGE
            NEXT_PUBLIC_PAYMENT_PROVIDER=none
            NEXT_PUBLIC_GENERATIONS_BUCKET_NAME=${{ inputs.generations_bucket_name || 'generations' }}
            NEXT_PUBLIC_AVATARS_BUCKET_NAME=${{ inputs.avatars_bucket_name || 'avatars' }}
            BETTER_AUTH_URL=${{ inputs.next_public_app_url || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（钉 SHA；dependabot 维护）

      - name: Prepare compose bundle
        run: |
          mkdir -p dist
          cp docker-compose.yml docker-compose.seoul.yml docker-compose.build.yml .env.docker.example README.md dist/
          tar -czf gpt2image-pro-${GITHUB_REF_NAME}.compose.tar.gz -C dist .
          zip -r gpt2image-pro-${GITHUB_REF_NAME}.compose.zip dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            gpt2image-pro-${{ github.ref_name }}.compose.tar.gz
            gpt2image-pro-${{ github.ref_name }}.compose.zip
