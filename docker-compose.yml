name: gpt2image-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt2image}
      POSTGRES_USER: ${POSTGRES_USER:-gpt2image}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gpt2image} -d ${POSTGRES_DB:-gpt2image}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/${GPT2IMAGE_IMAGE_NAMESPACE:-gaoren002}/gpt2image-pro-migrate:${GPT2IMAGE_IMAGE_TAG:-latest}
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt2image}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpt2image}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ghcr.io/${GPT2IMAGE_IMAGE_NAMESPACE:-gaoren002}/gpt2image-pro-web:${GPT2IMAGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt2image}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpt2image}
      # 鉴权必填:未配置会导致所有人(含超管)登录失败,务必先在 env 文件中设置。
      # BETTER_AUTH_SECRET: 会话/Cookie 签名密钥(随机长字符串,如 `openssl rand -base64 32`)。
      # BETTER_AUTH_URL: 站点对外访问地址(如 https://your-domain),须与浏览器实际访问的域名一致,
      #   否则登录回调/Cookie 域不匹配,超管也进不去。
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 必填:会话签名密钥,未设置将无法登录}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL 必填:须为站点公网访问地址(如 https://your-domain),否则登录失败}
      LOCAL_STORAGE_PATH: /app/storage
      CHATGPT_WEB_PROXY_URL: http://chatgpt-web-proxy:3021
      CHATGPT_WEB_PROXY_SECRET: ${CHATGPT_WEB_PROXY_SECRET:?set a random non-placeholder secret of at least 32 bytes}
      SUPER_RESOLUTION_WORKER_URL: http://super-resolution-worker:3310
      SUPER_RESOLUTION_WORKER_SECRET: ${SUPER_RESOLUTION_WORKER_SECRET:?set a random worker secret shared by web and worker}
      GPT2IMAGE_BOOTSTRAP_CREDENTIALS_PATH: /app/.gpt2image/super-admin-credentials.txt
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - app-storage:/app/storage
      - app-bootstrap:/app/.gpt2image
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chatgpt-web-proxy:
        condition: service_started
      super-resolution-worker:
        condition: service_healthy

  super-resolution-worker:
    image: ghcr.io/${GPT2IMAGE_IMAGE_NAMESPACE:-gaoren002}/gpt2image-pro-web:${GPT2IMAGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - ${GPT2IMAGE_ENV_FILE:-.env}
    environment:
      SUPER_RESOLUTION_WORKER_BIND: 0.0.0.0
      SUPER_RESOLUTION_WORKER_PORT: 3310
      SUPER_RESOLUTION_WORKER_SECRET: ${SUPER_RESOLUTION_WORKER_SECRET:?set a random worker secret shared by web and worker}
      SUPER_RESOLUTION_WORKER_CONCURRENCY: ${SUPER_RESOLUTION_WORKER_CONCURRENCY:-1}
      SUPER_RESOLUTION_INTRA_OP_THREADS: ${SUPER_RESOLUTION_INTRA_OP_THREADS:-24}
      SUPER_RESOLUTION_SHARP_CONCURRENCY: ${SUPER_RESOLUTION_SHARP_CONCURRENCY:-2}
      UV_THREADPOOL_SIZE: ${SUPER_RESOLUTION_UV_THREADPOOL_SIZE:-4}
      REALESR_MODEL_PATH: /app/apps/web/models/realesr-general-x4v3.onnx
    command: ["node", "apps/web/worker/super-resolution-worker.mjs"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3310/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 原生 ONNX 不受 V8 heap 限制，独立容器必须有物理内存上界。
    mem_limit: "${SUPER_RESOLUTION_WORKER_MEMORY_LIMIT:-6g}"
    memswap_limit: "${SUPER_RESOLUTION_WORKER_MEMORY_LIMIT:-6g}"
    cpus: "${SUPER_RESOLUTION_WORKER_CPUS:-24.0}"

  chatgpt-web-proxy:
    image: ghcr.io/${GPT2IMAGE_IMAGE_NAMESPACE:-gaoren002}/gpt2image-pro-chatgpt-web-proxy:${GPT2IMAGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CHATGPT_WEB_PROXY_BIND: :3021
      CHATGPT_WEB_PROXY_SECRET: ${CHATGPT_WEB_PROXY_SECRET:?set a random non-placeholder secret of at least 32 bytes}
      CHATGPT_WEB_PROXY_PROFILE: ${CHATGPT_WEB_PROXY_PROFILE:-chrome_146}
      CHATGPT_WEB_PROXY_TIMEOUT_SECONDS: ${CHATGPT_WEB_PROXY_TIMEOUT_SECONDS:-300}
      CHATGPT_WEB_PROXY_MAX_BODY_MB: ${CHATGPT_WEB_PROXY_MAX_BODY_MB:-64}
      CHATGPT_WEB_PROXY_MAX_CONCURRENT: ${CHATGPT_WEB_PROXY_MAX_CONCURRENT:-2}
      CHATGPT_WEB_PROXY_MAX_INFLIGHT_BODY_MB: ${CHATGPT_WEB_PROXY_MAX_INFLIGHT_BODY_MB:-64}
      CHATGPT_WEB_PROXY_MAX_SESSIONS: ${CHATGPT_WEB_PROXY_MAX_SESSIONS:-64}
      # 上游出口：POOL 为逗号分隔的多上游（按优先级，进程内健康探测+自动切换，
      # 见 services/chatgpt-web-proxy/upstream.go）；未配 POOL 时回落到单上游变量。
      CHATGPT_WEB_UPSTREAM_POOL: ${CHATGPT_WEB_UPSTREAM_POOL:-}
      CHATGPT_WEB_UPSTREAM_PROXY_URL: ${CHATGPT_WEB_UPSTREAM_PROXY_URL:-}
      CHATGPT_WEB_UPSTREAM_PROBE_INTERVAL_SECONDS: ${CHATGPT_WEB_UPSTREAM_PROBE_INTERVAL_SECONDS:-60}
      CHATGPT_WEB_UPSTREAM_PROBE_FAILURES: ${CHATGPT_WEB_UPSTREAM_PROBE_FAILURES:-3}
    # /healthz 在转发线程被阻塞时也会挂起，因此这个探测能暴露"进程在、但请求全部卡住"
    # 的状态（compose 的 restart 策略不会因 unhealthy 自动重启，需外部监控或人工介入）。
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 5 -O /dev/null http://127.0.0.1:3021/healthz || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  app-storage:
  app-bootstrap:
